<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>輸入你的答案</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #fff;
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .question {
      font-size: 1.15em;
      color: #4fc3f7;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .hint { font-size: 0.78em; color: #666; margin-bottom: 28px; }
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px 18px;
      color: #fff;
      font-size: 1.3em;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus { border-color: #4fc3f7; }
    input[type="text"]::placeholder { color: #444; }
    button {
      margin-top: 16px;
      width: 100%;
      background: #e8643a;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 1.15em;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.85; transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status {
      margin-top: 18px;
      font-size: 0.88em;
      color: #81c784;
      min-height: 26px;
      transition: opacity 0.4s;
    }
    .status.fade { opacity: 0; }
    .history {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .tag {
      background: rgba(79,195,247,0.15);
      border: 1px solid rgba(79,195,247,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.85em;
      color: #4fc3f7;
    }
    .conn { font-size: 0.7em; margin-bottom: 14px; }
    .conn.ok  { color: #81c784; }
    .conn.err { color: #f44336; }
  </style>
</head>
<body>
<div class="card">
  <div class="conn err" id="conn-status">連線中…</div>
  <div class="question" id="q-text">載入中…</div>
  <div class="hint">輸入一個詞，按送出</div>
  <input type="text" id="word-input" placeholder="你的答案" maxlength="12" autocomplete="off" />
  <button id="submit-btn" onclick="submitWord()">送出 ✓</button>
  <div class="status" id="status"></div>
  <div class="history" id="history"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
  import { getFirestore, collection, addDoc, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDBKSaZxs-tbW7bhxMVkyAr8yJ9lcxrmY0",
    authDomain: "claudeproject-a94ee.firebaseapp.com",
    projectId: "claudeproject-a94ee",
    storageBucket: "claudeproject-a94ee.firebasestorage.app",
    messagingSenderId: "708325305180",
    appId: "1:708325305180:web:b7617def9617d858a5af99"
  };

  const QUESTIONS = {
    icebreak: '你覺得現代警察辦案最重要的工具是什麼？',
    reflect:  '上完這堂課，你最想說的一個詞是什麼？',
  };
  const COLLECTIONS = {
    icebreak: 'aitechdet_wordcloud',
    reflect:  'aitechdet_reflect',
  };

  const params = new URLSearchParams(location.search);
  const room = params.get('room') || 'icebreak';

  document.getElementById('q-text').textContent = QUESTIONS[room] || '輸入一個詞';

  let db, wordsRef;
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    wordsRef = collection(db, COLLECTIONS[room]);
    document.getElementById('conn-status').className = 'conn ok';
    document.getElementById('conn-status').textContent = '✓ 已連線（可使用行動數據）';
  } catch(e) {
    document.getElementById('conn-status').className = 'conn err';
    document.getElementById('conn-status').textContent = '✗ 連線失敗，請確認網路';
  }

  const input = document.getElementById('word-input');
  const btn   = document.getElementById('submit-btn');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') submitWord(); });

  window.submitWord = async function() {
    const word = input.value.trim();
    if (!word || !wordsRef) return;
    btn.disabled = true;
    try {
      await addDoc(wordsRef, { word, ts: serverTimestamp() });
      const history = document.getElementById('history');
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = word;
      history.prepend(tag);
      input.value = '';
      const status = document.getElementById('status');
      status.textContent = `「${word}」已送出！`;
      status.classList.remove('fade');
      setTimeout(() => status.classList.add('fade'), 2000);
    } catch(e) {
      document.getElementById('status').textContent = '送出失敗，請重試';
    } finally {
      btn.disabled = false;
      input.focus();
    }
  };
</script>
</body>
</html>
